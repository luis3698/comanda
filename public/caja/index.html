<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Cuentas · SIGR</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/caja.css">
</head>
<body class="caja">
  <header class="pos-cab">
    <span class="pos-cab__marca"><span aria-hidden="true">💳</span> POS</span>
    <span class="pos-cab__turno" id="estado-turno">—</span>
    <span class="pos-cab__reloj" id="reloj-pos">--:--</span>
    <div id="indicador-conexion"></div>
    <nav class="pos-nav" aria-label="Navegación de caja">
      <a class="pos-nav__item" id="nav-cuentas" href="/caja/"><span aria-hidden="true">🧾</span> <span>Cuentas</span></a>
      <a class="pos-nav__item" id="nav-turno" href="/caja/turno.html"><span aria-hidden="true">💰</span> <span>Turno</span></a>
    </nav>
    <span class="texto-sm" id="nombre-cajero" style="opacity:.9"></span>
    <button class="btn btn--secundario btn--sm" type="button" id="btn-salir-pos">Salir</button>
  </header>

  <!-- Vista 18: Panel Central de Cuentas y Mesas -->
  <main class="pos-main" id="contenido">
    <div id="aviso-sin-turno" class="oculto">
      <div class="sin-turno">
        <span style="font-size:2.5rem" aria-hidden="true">🔒</span>
        <h1>No hay turno abierto</h1>
        <p class="texto-tenue">Para cobrar necesita abrir un turno de caja con su fondo inicial.</p>
        <a class="btn btn--primario" href="/caja/turno.html">Abrir turno</a>
      </div>
    </div>

    <div id="panel-cuentas">
      <div class="herramientas">
        <div class="buscador">
          <span class="buscador__icono" aria-hidden="true">🔍</span>
          <label class="solo-lectores" for="buscar">Buscar mesa o mesero</label>
          <input class="campo__control" id="buscar" type="search" placeholder="Buscar por mesa o mesero…" autocomplete="off">
        </div>
        <span class="crece"></span>
        <span class="insignia insignia--neutra" id="conteo-cuentas">—</span>
      </div>
      <div class="cuentas-lista" id="cuentas-lista"></div>
    </div>
  </main>

  <script type="module" src="/caja/js/cuentas.js"></script>
</body>
</html>
