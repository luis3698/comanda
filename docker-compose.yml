services:
  db:
    image: mysql:8.0
    container_name: sigr_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_sigr_dev}
      MYSQL_DATABASE: ${DB_NAME:-sigr}
      MYSQL_USER: ${DB_USER:-sigr_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sigr_app_dev}
      TZ: ${TZ:-America/Bogota}
    # Los scripts de db/ se ejecutan en orden alfabetico la primera vez que
    # se crea el volumen: 01_schema -> 02_permisos -> 03_seed -> 04_privilegios.
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - sigr_datos:/var/lib/mysql
    ports:
      - "${DB_PORT_HOST:-3307}:3306"
    command: --default-authentication-plugin=caching_sha2_password
    # Se comprueba por TCP contra 127.0.0.1, no por socket con -h localhost.
    # Durante la inicializacion MySQL levanta un servidor temporal con
    # --skip-networking que SI responde al socket: un ping por socket daria
    # "healthy" antes de que la base este realmente lista, y la API arrancaria
    # demasiado pronto. El puerto TCP solo abre cuando el servidor definitivo
    # esta en pie y los scripts de db/ ya corrieron.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-P", "3306", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_sigr_dev}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build: .
    container_name: sigr_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # TODO el .env entra en el contenedor.
    #
    # Antes las variables se enumeraban una a una aqui abajo, y cualquiera que
    # no estuviera en esa lista se ignoraba EN SILENCIO: se configuraba en el
    # .env, el servidor de desarrollo la respetaba y el contenedor no. Paso con
    # las credenciales de FCM -- el push quedaba "configurado" y el contenedor
    # seguia avisando de que no lo estaba -- y afectaba igual a MAPA_*,
    # BCRYPT_COSTO, SESION_HORAS y COOKIE_SEGURA.
    #
    # Con env_file no hay lista que mantener: una variable nueva en .env llega
    # sola. Lo de `environment` de abajo sigue mandando, porque en Compose tiene
    # prioridad sobre env_file, y es justo lo que hace falta para las tres que
    # DENTRO de la red de Docker valen otra cosa.
    #
    # `required: false` porque sin él un .env ausente tumba TODO el comando,
    # incluido `docker compose ps` o `logs`, con un mensaje que habla de
    # GetFileAttributesEx y no de copiar .env.example. Es el primer tropiezo en
    # una maquina recien clonada, y deja el proyecto pareciendo roto cuando solo
    # falta un archivo. Sin el .env el sistema arranca igual: los valores por
    # defecto de `environment` cubren lo imprescindible y las variables
    # opcionales -- FCM, MAPA_* -- ya estan pensadas para poder faltar.
    #
    # Quien use `npm run arrancar` ni se entera: ese guion crea el .env antes.
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      # Dentro de la red de Docker la base es el servicio "db" en el 3306, no
      # el localhost:3307 que ve el anfitrion. Estas tres SIEMPRE ganan al .env.
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-sigr}
      DB_USER: ${DB_USER:-sigr_app}
      DB_PASSWORD: ${DB_PASSWORD:-sigr_app_dev}
      TZ: ${TZ:-America/Bogota}
    # Las imagenes de los platos son lo unico que la aplicacion escribe en disco.
    # Sin este volumen viven dentro del contenedor, y un "up --build" lo recrea:
    # los archivos desaparecen mientras la base sigue apuntando a /uploads/xxx.jpg,
    # asi que la carta entera queda con imagenes rotas y sin forma de recuperarlas.
    # Docker inicializa el volumen con el contenido y los permisos del directorio
    # de la imagen, que el Dockerfile ya deja como node:node.
    volumes:
      - sigr_imagenes:/app/public/uploads
      # Cache de teselas del mapa. Por la misma razon que las imagenes: sin el
      # volumen, un "up --build" la vacia y el mapa vuelve a descargar cada
      # tesela de OpenStreetMap desde cero. La diferencia es que perder esta
      # cache no rompe nada -- se rellena sola -- pero castiga a un servicio
      # publico gratuito, que es lo que su politica de uso pide evitar.
      - sigr_teselas:/app/.cache/teselas
    ports:
      - "${PORT_HOST:-3000}:3000"

volumes:
  sigr_datos:
  sigr_imagenes:
  sigr_teselas:
