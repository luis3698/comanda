# =====================================================================
# SIGR Cliente — configuración de compilación
# =====================================================================

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official


# ---------------------------------------------------------------------
# DÓNDE ESTÁ EL SERVIDOR
#
# Este es el único punto de unión con el proyecto web, y es un valor de
# configuración, NO una ruta de archivo: por eso la carpeta `movil/` se
# puede sacar del repositorio y seguir funcionando.
#
# El valor llega al código como BuildConfig.API_BASE_URL.
#
# YA NO HACE FALTA TOCAR ESTO PARA DESARROLLAR.
#
# La app busca el servidor sola al arrancar: prueba 10.0.2.2 (emulador) y
# localhost (móvil con `adb reverse tcp:3000 tcp:3000`), y si ninguno
# responde, ofrece un campo para escribir la dirección DENTRO de la propia
# aplicación, sin recompilar. La dirección que funcione se guarda.
#
# Este valor queda solo como punto de partida del primer intento. Cambiarlo
# es opcional; lo que se escriba en la app tiene prioridad.
#
# La barra final es OBLIGATORIA: Retrofit la exige en la URL base.
# ---------------------------------------------------------------------
API_BASE_URL_DEBUG=http://10.0.2.2:3000/

# En producción, HTTPS siempre. El network_security_config solo permite
# tráfico sin cifrar hacia los hosts de desarrollo.
API_BASE_URL_RELEASE=https://cambieme.ejemplo.com/

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
